{% extends "base.html" %}

<p>You can close this tab and return to Grafana.</p>
<p>
  <a href="/">View all rules</a>
  &nbsp; · &nbsp;

<script>

  setTimeout(function () { try { window.close(); } catch (e) {} }, 700);
</script>
{% endblock %}
