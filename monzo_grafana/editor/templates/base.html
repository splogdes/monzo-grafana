<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>{{ title }}</title>
  <style>
  body { font-family: system-ui, -apple-system, sans-serif; max-width: {{ wide and "1100px" or "720px" }};
         margin: 2em auto; padding: 0 1em; color: #222; }
  h1 { margin-bottom: 0.2em; }
  .tx { background: #f4f4f6; padding: 0.8em 1em; border-radius: 6px; margin: 1em 0; }
  .tx strong { font-size: 1.1em; }
  label { display: block; margin: 0.9em 0 0.3em; font-weight: 600; font-size: 0.92em; }
  input, select, button { font-size: 1em; padding: 0.4em 0.6em; border-radius: 4px;
                          border: 1px solid #ccc; box-sizing: border-box; }
  input[type=text], input[type=number], select { width: 100%; max-width: 360px; }
  .row { display: flex; gap: 0.5em; max-width: 360px; }
  .row > select { flex: 0 0 60%; width: auto; }
  .row > input  { flex: 1 1 40%; width: auto; min-width: 0; }
  button { cursor: pointer; background: #3b82f6; color: white; border: none;
           padding: 0.55em 1.2em; margin-right: 0.4em; }
  button.secondary { background: #64748b; }
  button.danger    { background: #ef4444; }
  a.btn-link { display: inline-block; background: #3b82f6; color: white; text-decoration: none;
               padding: 0.55em 1.2em; border-radius: 4px; font-size: 1em; }
  table { border-collapse: collapse; width: 100%; }
  th, td { border-bottom: 1px solid #e2e8f0; padding: 0.5em 0.4em; text-align: left;
           font-size: 0.92em; }
  th { background: #f8fafc; }
  .nav { margin-bottom: 1.5em; }
  .nav a { margin-right: 1em; }
  .empty { color: #888; font-style: italic; }
  .flash { color: #15803d; }
  code { background: #eef; padding: 0.1em 0.3em; border-radius: 3px; }
  </style>
</head>
<body>
  <div class="nav">
    <a href="/">All rules</a> · <a href="/groups">Groups</a> · <a href="/splits">Splits</a>
  </div>
  {% if message %}<p class="flash">{{ message }}</p>{% endif %}
  {% block content %}{% endblock %}
</body>
</html>
