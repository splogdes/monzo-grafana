services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    environment:
      POSTGRES_USER: monzo
      POSTGRES_DB: finance
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U monzo -d finance"]
      interval: 5s
      timeout: 3s
      retries: 10

  grafana:
    image: grafana/grafana-oss:11.1.3
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana
    environment:
      GF_SERVER_DOMAIN: localhost
      GF_SERVER_ROOT_URL: "http://localhost:3000"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SECURITY_ADMIN_PASSWORD: ${GF_SECURITY_ADMIN_PASSWORD}
    depends_on:
      - postgres

  poller:
    build: .
    restart: unless-stopped
    command: ["uv", "run", "monzo-poller", "schedule"]
    ports:
      # OAuth callback — only needed during `monzo-poller auth`.
      - "127.0.0.1:7923:7923"
    volumes:
      # Runtime data shared with the rule-editor.
      - ./data:/app/data
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_USER: monzo
      POSTGRES_DB: finance
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      MONZO_CLIENT_ID: ${MONZO_CLIENT_ID}
      MONZO_CLIENT_SECRET: ${MONZO_CLIENT_SECRET}
      MONZO_REDIRECT_URI: "http://localhost:7923/callback"
      MONZO_AUTH_BIND_ALL: "1"
      GRAFANA_URL: "http://grafana:3000"
      GRAFANA_TOKEN: ${GRAFANA_TOKEN:-}
      TOKEN_FILE: "/app/data/tokens.json"
      CATEGORIES_FILE: "/app/data/categories.yaml"
      POLLER_TRIGGER_BIND: "0.0.0.0"
      POLLER_TRIGGER_PORT: "7925"
      POLL_INTERVAL_MINUTES: ${POLL_INTERVAL_MINUTES:-30}
      LOOKBACK_DAYS: ${LOOKBACK_DAYS:-90}
    depends_on:
      postgres:
        condition: service_healthy

  rule-editor:
    build: .
    restart: unless-stopped
    command: ["uv", "run", "monzo-rule-editor"]
    ports:
      - "127.0.0.1:7924:7924"
    volumes:
      - ./data:/app/data
    environment:
      EDITOR_BIND: "0.0.0.0"
      EDITOR_PORT: "7924"
      CATEGORIES_FILE: "/app/data/categories.yaml"
      # Read existing categories for the autocomplete dropdown.
      POSTGRES_HOST: postgres
      POSTGRES_USER: monzo
      POSTGRES_DB: finance
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      # Talk to the poller container by service name.
      POLLER_TRIGGER_URL: "http://poller:7925/poll"
    depends_on:
      - poller

volumes:
  postgres-data:
  grafana-data:
