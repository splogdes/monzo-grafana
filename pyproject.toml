[project]
name = "monzo-grafana"
version = "0.1.0"
description = "Monzo → Postgres poller and rule editor for a personal-finance Grafana dashboard"
requires-python = ">=3.12"
dependencies = [
    "requests>=2.32.0",
    "psycopg[binary]>=3.2",
    "schedule>=1.2.2",
    "python-dateutil>=2.9.0",
    "pyyaml>=6.0",
    "jinja2>=3.1",
]

[project.scripts]
monzo-poller = "monzo_grafana.cli:main"
monzo-rule-editor = "monzo_grafana.editor.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["monzo_grafana"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "mypy>=1.10",
    "types-pyyaml",
    "types-requests",
    "types-python-dateutil",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
files = ["monzo_grafana", "tests"]
strict = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["schedule.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
